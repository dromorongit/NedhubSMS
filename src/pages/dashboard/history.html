<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message History - Nedhub Bulk Messaging</title>
    <link rel="icon" type="image/png" href="../../assets/images/Nedhubsymbol.PNG">
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../styles/dashboard.css">
    <script src="../../utils/api.js" defer></script>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../../assets/images/Nedhublogo.PNG" alt="Nedhub Logo" class="sidebar-logo">
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="overview.html">Overview</a></li>
                    <li><a href="send-sms.html">Send SMS</a></li>
                    <li><a href="contacts.html">Contacts</a></li>
                    <li><a href="history.html" class="active">Message History</a></li>
                    <li><a href="reports.html">Reports</a></li>
                    <li><a href="settings.html">Settings</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header class="top-nav">
                <div class="user-info">
                    <span>Welcome, User</span>
                </div>
            </header>
            <div class="dashboard-content">
                <h2>Message History</h2>
                <div class="history-header">
                    <input type="text" placeholder="Search messages..." class="search-input">
                </div>
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Recipient</th>
                            <th>Message</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>2023-01-01 12:00</td>
                            <td>+233123456789</td>
                            <td>Hello, this is a test message</td>
                            <td><span class="status-badge delivered">Delivered</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script>
        async function loadMessageHistory() {
            try {
                const result = await window.apiClient.getMessageHistory();
                if (result.error) {
                    console.error(result.error);
                    return;
                }
                
                const messages = result.data || [];
                const tbody = document.querySelector('.history-table tbody');
                tbody.innerHTML = '';
                
                if (messages.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No messages found</td></tr>';
                    return;
                }
                
                messages.forEach(msg => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${new Date(msg.createdAt).toLocaleString()}</td>
                        <td>${msg.recipient}</td>
                        <td>${msg.message.substring(0, 50)}${msg.message.length > 50 ? '...' : ''}</td>
                        <td><span class="status-badge ${msg.status}">${msg.status}</span></td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading message history:', error);
            }
        }
        
        // Search functionality
        document.querySelector('.search-input').addEventListener('input', function() {
            // Simple client-side filtering
            const searchTerm = this.value.toLowerCase();
            document.querySelectorAll('.history-table tbody tr').forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(searchTerm) ? '' : 'none';
            });
        });
        
        loadMessageHistory();
    </script>
</body>
</html>
