<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Nedhub Bulk Messaging</title>
    <link rel="icon" type="image/png" href="../../assets/images/Nedhubsymbol.PNG">
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../styles/auth.css">
    <script src="../../utils/authStorage.js"></script>
    <script src="../../utils/api.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-page">
        <!-- Left Side - Image Section -->
        <div class="auth-image-section forgot-password-image">
            <div class="auth-image-overlay"></div>
            <div class="auth-image-content">
                <div class="brand-badge">Nedhub</div>
                <h1>Reset Your Password</h1>
                <p>Enter your email address and we'll send you a code to reset your password.</p>
                <div class="security-info">
                    <div class="security-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                        <span>Secure password reset</span>
                    </div>
                    <div class="security-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span>Code expires in 15 minutes</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side - Form Section -->
        <div class="auth-form-section">
            <div class="auth-form-container">
                <div class="auth-logo-mobile">
                    <img src="../../assets/images/Nedhublogo.PNG" alt="Nedhub Logo" class="logo-img">
                </div>
                
                <div class="auth-form-header">
                    <h2>Forgot Password?</h2>
                    <p>Enter your email to receive a password reset code</p>
                </div>

                <form id="forgotPasswordForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">
                        <span>Send Reset Code</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Remember your password? <a href="login.html">Sign in</a></p>
                </div>
            </div>
        </div>
    </div>

    <style>
        .forgot-password-image {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .security-info {
            margin-top: 40px;
        }

        .security-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.9);
        }

        .security-item svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const submitBtn = this.querySelector('button[type="submit"]');
                const originalBtnContent = submitBtn.innerHTML;

                // Validate email
                if (!email) {
                    showError('Please enter your email address');
                    return;
                }

                // Disable button during request
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span>Sending...</span><svg class="btn-spinner" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round"/></svg>';

                try {
                    const result = await window.apiClient.requestPasswordReset(email);
                    
                    if (result.error) {
                        showError(result.error);
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = originalBtnContent;
                    } else {
                        // Store email for reset password page
                        localStorage.setItem('pendingPasswordResetEmail', email);
                        
                        showSuccess('Reset code sent to your email!');
                        
                        setTimeout(() => {
                            window.location.href = 'reset-password.html';
                        }, 2000);
                    }
                } catch (error) {
                    console.error('Forgot password error:', error);
                    showError('An error occurred. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnContent;
                }
            });
        });

        function showError(message) {
            const existingError = document.querySelector('.error-message');
            if (existingError) existingError.remove();

            const form = document.getElementById('forgotPasswordForm');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg><span>' + message + '</span>';
            form.insertBefore(errorDiv, form.firstChild);
            
            setTimeout(() => {
                errorDiv.style.opacity = '0';
                setTimeout(() => errorDiv.remove(), 300);
            }, 5000);
        }

        function showSuccess(message) {
            const existingSuccess = document.querySelector('.success-message');
            if (existingSuccess) existingSuccess.remove();

            const form = document.getElementById('forgotPasswordForm');
            const successDiv = document.createElement('div');
            successDiv.className = 'success-message';
            successDiv.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg><span>' + message + '</span>';
            form.insertBefore(successDiv, form.firstChild);
        }
    </script>
</body>
</html>
