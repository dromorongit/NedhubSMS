<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message History - Nedhub Bulk Messaging</title>
    <link rel="icon" type="image/png" href="../../assets/images/Nedhubsymbol.PNG">
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../styles/dashboard.css">
    <link rel="stylesheet" href="../../styles/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400,500,700,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/nedhub-app.css">
    <script src="../../utils/authStorage.js"></script>
    <script src="../../utils/api.js" defer></script>
    <script src="../../utils/toast.js" defer></script>
    <script src="../../utils/escape.js"></script>
    <link rel="stylesheet" href="../../styles/shell.css?v=2">
</head>
<body class="nhs-has-shell">
    <div class="dashboard-layout">
        <div id="nhs-sidebar-mount"></div>
        <main class="main-content">
            <div id="nhs-topbar-mount"></div>
    <script src="../../utils/shell.js?v=2"></script>
            <!-- Sidebar Overlay -->
            <div class="dashboard-content">
                <div class="welcome-section">
                    <h2 id="pageTitle">Message History</h2>
                    <p class="welcome-subtitle">View all your sent messages and their delivery status</p>
                </div>

                <!-- Stats Row -->
                <div class="history-stats">
                    <div class="stat-mini">
                        <div class="stat-mini-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
                            </svg>
                        </div>
                        <div class="stat-mini-content">
                            <span class="stat-mini-value" id="totalMessages">0</span>
                            <span class="stat-mini-label">Total Messages</span>
                        </div>
                    </div>
                    <div class="stat-mini">
                        <div class="stat-mini-icon delivered">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                        </div>
                        <div class="stat-mini-content">
                            <span class="stat-mini-value" id="deliveredCount">0</span>
                            <span class="stat-mini-label">Delivered</span>
                        </div>
                    </div>
                    <div class="stat-mini">
                        <div class="stat-mini-icon queued">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 16 14"></polyline>
                            </svg>
                        </div>
                        <div class="stat-mini-content">
                            <span class="stat-mini-value" id="queuedCount">0</span>
                            <span class="stat-mini-label">Queued</span>
                        </div>
                    </div>
                    <div class="stat-mini">
                        <div class="stat-mini-icon failed">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="15" y1="9" x2="9" y2="15"></line>
                                <line x1="9" y1="9" x2="15" y2="15"></line>
                            </svg>
                        </div>
                        <div class="stat-mini-content">
                            <span class="stat-mini-value" id="failedCount">0</span>
                            <span class="stat-mini-label">Failed</span>
                        </div>
                    </div>
                </div>

                <!-- Actions Bar -->
                <div class="actions-bar">
                    <div class="search-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="searchInput" placeholder="Search by recipient, message, or status...">
                    </div>
                    <div class="filter-wrapper">
                        <select id="statusFilter">
                            <option value="">All Status</option>
                            <option value="delivered">Delivered</option>
                            <option value="sent">Sent</option>
                            <option value="processing">Processing</option>
                            <option value="queued">Queued</option>
                            <option value="failed">Failed</option>
                            <option value="scheduled">Scheduled</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div class="filter-wrapper">
                        <select id="dateFilter">
                            <option value="">All Time</option>
                            <option value="today">Today</option>
                            <option value="week">This Week</option>
                            <option value="month">This Month</option>
                        </select>
                    </div>
                </div>

                <!-- Messages Table Card -->
                <div class="history-card">
                    <div class="table-container">
                        <table class="history-table" id="messagesTable">
                            <thead>
                                <tr>
                                    <th class="sortable" data-sort="createdAt" aria-sort="none">Date & Time <span class="sort-indicator" aria-hidden="true"></span></th>
                                    <th>Sender ID</th>
                                    <th class="sortable" data-sort="recipient" aria-sort="none">Recipient <span class="sort-indicator" aria-hidden="true"></span></th>
                                    <th>Message</th>
                                    <th class="sortable" data-sort="status" aria-sort="none">Status <span class="sort-indicator" aria-hidden="true"></span></th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="messagesBody">
                                <!-- Messages will be loaded here -->
                            </tbody>
                        </table>
                        <div class="loading-spinner" id="loadingSpinner">
                            <div class="spinner"></div>
                            <p>Loading message history...</p>
                        </div>
                        <div class="empty-state" id="emptyState" style="display: none;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
                            </svg>
                            <p>No messages yet</p>
                            <span>Your sent messages will appear here</span>
                        </div>
                        <div class="history-pagination" id="historyPagination" style="display: none;">
                            <div class="pagination-info" id="paginationInfo">Showing 0–0 of 0 messages</div>
                            <div class="pagination-controls">
                                <button type="button" class="pagination-btn pagination-prev" id="paginationPrev" disabled>Prev</button>
                                <div class="pagination-numbers" id="paginationNumbers"></div>
                                <button type="button" class="pagination-btn pagination-next" id="paginationNext" disabled>Next</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Message Detail Modal -->
    <div class="modal" id="messageModal">
        <div class="modal-content modal-large">
            <button class="modal-close" id="closeMessageModal">&times;</button>
            <div class="modal-header">
                <div class="modal-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
                    </svg>
                </div>
                <h3>Message Details</h3>
            </div>
            <div class="message-detail-content" id="messageDetailContent">
                <!-- Message details will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        const el = (id) => document.getElementById(id);

        let messages = [];
        let currentPage = 1;
        const PAGE_SIZE = 10;
        let sortKey = null;
        let sortDir = 'asc';

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuthAndLoad();
        });

        async function checkAuthAndLoad() {
            const token = window.getStorage ? window.getStorage().getItem('authToken') : localStorage.getItem('authToken');
            console.log('[AuthBootstrap] [Dashboard] checkAuthAndLoad - token present:', !!token);
            if (!token) {
                window.location.href = '../auth/login.html';
                return;
            }

            await loadUserProfile();
            await loadMessageHistory();
            initSortHandlers();
        }

        async function loadUserProfile() {
            try {
                const storage = window.getStorage ? window.getStorage() : localStorage;
                const response = await window.apiClient.getUserProfile();
                if (response.error) {
                    useStoredUserName();
                    return;
                }

                if (response.data && response.data.user) {
                    const user = response.data.user;
                    const firstName = user.name ? user.name.split(' ')[0] : 'User';
                    updateUserDisplay(firstName);
                    storage.setItem('userName', user.name);
                } else {
                    useStoredUserName();
                }
            } catch (error) {
                console.error('Error loading user profile:', error);
                useStoredUserName();
            }
        }

        function useStoredUserName() {
            const storage = window.getStorage ? window.getStorage() : localStorage;
            const storedName = storage.getItem('userName');
            if (storedName) {
                const firstName = storedName.split(' ')[0];
                updateUserDisplay(firstName);
            } else {
                updateUserDisplay('User');
            }
        }

        function updateUserDisplay(firstName) {
            const userNameEl = document.getElementById('userName');
            const userAvatarEl = document.getElementById('userAvatar');

            if (userNameEl) userNameEl.textContent = firstName;
            if (userAvatarEl) userAvatarEl.textContent = (window.NhShell && typeof window.NhShell.initials === 'function') ? window.NhShell.initials(firstName) : (firstName.charAt(0) + (firstName.charAt(1) || '')).toUpperCase();
        }

        function formatPhone(raw) {
            if (!raw) return '-';
            let s = String(raw).trim().replace(/[\s\-\(\)]/g, '');
            let n = s;
            if (n.startsWith('+233')) n = n.slice(1);
            if (n.startsWith('0')) n = '233' + n.slice(1);
            if (/^233\d{9}$/.test(n)) {
                const rest = n.slice(3);
                return '+233 ' + rest.slice(0, 2) + ' ' + rest.slice(2, 5) + ' ' + rest.slice(5, 9);
            }
            return escapeHtml(raw);
        }

        async function loadMessageHistory() {
            const spinner = el('loadingSpinner');
            const emptyState = el('emptyState');
            const tbody = el('messagesBody');
            const totalMessagesEl = el('totalMessages');
            const deliveredCountEl = el('deliveredCount');
            const queuedCountEl = el('queuedCount');
            const failedCountEl = el('failedCount');

            if (!tbody) return;

            try {
                spinner.style.display = 'flex';
                tbody.innerHTML = '';

                const result = await window.apiClient.getMessageHistory();

                spinner.style.display = 'none';

                if (result.error) {
                    console.error('[MessageHistory] Error:', result.error);
                    tbody.innerHTML = '<tr><td colspan="6" class="error">Failed to load message history</td></tr>';
                    return;
                }

                const responseData = result.data;
                messages = responseData.messages || [];
                currentPage = 1;
                sortKey = null;
                sortDir = 'asc';
                renderMessages();
            } catch (error) {
                spinner.style.display = 'none';
                console.error('[MessageHistory] Error loading history:', error);
                tbody.innerHTML = '<tr><td colspan="6" class="error">Failed to load message history</td></tr>';
            }
        }

        function getDateFiltered() {
            const dateFilter = el('dateFilter').value;
            if (!dateFilter) return messages.slice();
            const now = new Date();
            return messages.filter(msg => {
                if (!msg.createdAt) return false;
                const d = new Date(msg.createdAt);
                if (dateFilter === 'today') return d.toDateString() === now.toDateString();
                if (dateFilter === 'week') return d >= new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                if (dateFilter === 'month') return d >= new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
                return true;
            });
        }

        function applySearchStatus(list) {
            const searchTerm = el('searchInput').value.toLowerCase();
            const statusFilter = el('statusFilter').value;
            return list.filter(msg => {
                const matchesSearch = !searchTerm || (
                    (msg.recipient && msg.recipient.toLowerCase().includes(searchTerm)) ||
                    (msg.message && msg.message.toLowerCase().includes(searchTerm)) ||
                    (msg.senderId && msg.senderId.toLowerCase().includes(searchTerm)) ||
                    (msg.status && msg.status.toLowerCase().includes(searchTerm))
                );
                const matchesStatus = !statusFilter || msg.status?.toLowerCase() === statusFilter;
                return matchesSearch && matchesStatus;
            });
        }

        function sortList(list) {
            if (!sortKey) return list.slice();
            return [...list].sort((a, b) => {
                let av = a[sortKey];
                let bv = b[sortKey];
                if (sortKey === 'createdAt') {
                    av = av ? new Date(av).getTime() : 0;
                    bv = bv ? new Date(bv).getTime() : 0;
                } else {
                    av = String(av || '').toLowerCase();
                    bv = String(bv || '').toLowerCase();
                }
                if (av < bv) return sortDir === 'asc' ? -1 : 1;
                if (av > bv) return sortDir === 'asc' ? 1 : -1;
                return 0;
            });
        }

        function updateStats(list) {
            const totalMessagesEl = el('totalMessages');
            const deliveredCountEl = el('deliveredCount');
            const queuedCountEl = el('queuedCount');
            const failedCountEl = el('failedCount');

            const total = list.length;
            const delivered = list.filter(m => m.status === 'delivered').length;
            const queued = list.filter(m => m.status === 'queued').length;
            const failed = list.filter(m => m.status === 'failed').length;

            if (totalMessagesEl) totalMessagesEl.textContent = total.toLocaleString();
            if (deliveredCountEl) deliveredCountEl.textContent = delivered.toLocaleString();
            if (queuedCountEl) queuedCountEl.textContent = queued.toLocaleString();
            if (failedCountEl) failedCountEl.textContent = failed.toLocaleString();
        }

        function updateEmptyText(hasMessages, hasMatches) {
            const emptyState = el('emptyState');
            const title = emptyState.querySelector('p');
            const desc = emptyState.querySelector('span');
            if (!hasMessages) {
                if (title) title.textContent = 'No messages yet';
                if (desc) desc.textContent = 'Your sent messages will appear here';
            } else if (!hasMatches) {
                if (title) title.textContent = 'No messages match your filters';
                if (desc) desc.textContent = 'Try adjusting your search, status, or date range';
            } else {
                if (title) title.textContent = 'No messages yet';
                if (desc) desc.textContent = 'Your sent messages will appear here';
            }
        }

        function renderPagination(total, totalPages) {
            const pagination = el('historyPagination');
            const info = el('paginationInfo');
            const prevBtn = el('paginationPrev');
            const nextBtn = el('paginationNext');
            const numbers = el('paginationNumbers');
            if (!pagination) return;

            const start = (currentPage - 1) * PAGE_SIZE + 1;
            const end = Math.min(currentPage * PAGE_SIZE, total);
            if (info) info.textContent = 'Showing ' + start + '–' + end + ' of ' + total + ' messages';
            if (prevBtn) prevBtn.disabled = currentPage <= 1;
            if (nextBtn) nextBtn.disabled = currentPage >= totalPages;

            pagination.style.display = total > 0 ? 'flex' : 'none';
            if (!numbers) return;
            numbers.innerHTML = '';
            const maxButtons = 5;
            let first = Math.max(1, currentPage - 2);
            let last = Math.min(totalPages, first + maxButtons - 1);
            if (last - first < maxButtons - 1) first = Math.max(1, last - maxButtons + 1);
            for (let p = first; p <= last; p++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'pagination-num' + (p === currentPage ? ' active' : '');
                btn.textContent = p;
                btn.addEventListener('click', () => { currentPage = p; renderMessages(); });
                numbers.appendChild(btn);
            }
        }

        function renderMessages() {
            const tbody = el('messagesBody');
            const emptyState = el('emptyState');
            const pagination = el('historyPagination');
            if (!tbody) return;

            const dateFiltered = getDateFiltered();
            updateStats(dateFiltered);

            const tableList = applySearchStatus(dateFiltered);
            const sorted = sortList(tableList);
            const total = sorted.length;
            const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;
            const start = (currentPage - 1) * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, total);
            const pageItems = sorted.slice(start, end);

            tbody.innerHTML = '';

            if (messages.length === 0) {
                updateEmptyText(false, false);
                emptyState.style.display = 'flex';
                if (pagination) pagination.style.display = 'none';
                return;
            }

            if (pageItems.length === 0) {
                updateEmptyText(true, false);
                emptyState.style.display = 'flex';
                if (pagination) pagination.style.display = 'none';
                return;
            }

            updateEmptyText(true, true);
            emptyState.style.display = 'none';
            if (pagination) pagination.style.display = 'flex';

            pageItems.forEach(msg => {
                const row = document.createElement('tr');
                const date = msg.createdAt ? new Date(msg.createdAt).toLocaleString() : '-';
                const messagePreview = msg.message ? msg.message.substring(0, 60) + (msg.message.length > 60 ? '...' : '') : '-';

                row.innerHTML = `
                    <td class="message-date">${date}</td>
                    <td class="message-sender">${escapeHtml(msg.senderId || '-')}</td>
                    <td class="message-recipient">${formatPhone(msg.recipient)}</td>
                    <td class="message-text">${escapeHtml(messagePreview)}</td>
                    <td><span class="status-badge ${getStatusClass(msg.status)}">${escapeHtml(formatStatus(msg.status))}</span></td>
                    <td class="message-actions">
                        ${msg.status === 'failed' && msg.source === 'new' ? `<button class="resend-btn" data-message-id="${escapeAttr(msg._id)}" title="Resend Failed Message">Resend</button>` : ''}
                    </td>
                `;
                tbody.appendChild(row);
            });

            renderPagination(total, totalPages);
        }

        function getStatusClass(status) {
          switch (status?.toLowerCase()) {
            case 'delivered':
              return 'delivered';
            case 'sent':
              return 'sent';
            case 'processing':
              return 'processing';
            case 'queued':
              return 'queued';
            case 'failed':
              return 'failed';
            case 'scheduled':
              return 'scheduled';
            case 'cancelled':
              return 'cancelled';
            default:
              return 'queued';
          }
        }

        function formatStatus(status) {
            if (!status) return 'Unknown';
            return status.charAt(0).toUpperCase() + status.slice(1);
        }

        // Search and filter functionality - all combine and reset to page 1 on change
        el('searchInput').addEventListener('input', function() {
            currentPage = 1;
            renderMessages();
        });

        el('statusFilter').addEventListener('change', function() {
            currentPage = 1;
            renderMessages();
        });

        el('dateFilter').addEventListener('change', function() {
            currentPage = 1;
            renderMessages();
        });

        // Pagination controls
        el('paginationPrev').addEventListener('click', function() {
            if (currentPage > 1) { currentPage--; renderMessages(); }
        });
        el('paginationNext').addEventListener('click', function() {
            const total = applySearchStatus(getDateFiltered()).length;
            const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
            if (currentPage < totalPages) { currentPage++; renderMessages(); }
        });

        // Sorting
        function initSortHandlers() {
            const table = el('messagesTable');
            if (!table) return;
            table.querySelectorAll('th.sortable').forEach(th => {
                th.addEventListener('click', function() {
                    const key = this.dataset.sort;
                    if (sortKey === key) {
                        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
                    } else {
                        sortKey = key;
                        sortDir = 'asc';
                    }
                    updateSortUI();
                    currentPage = 1;
                    renderMessages();
                });
            });
        }

        function updateSortUI() {
            const table = el('messagesTable');
            if (!table) return;
            table.querySelectorAll('th.sortable').forEach(th => {
                const key = th.dataset.sort;
                const active = sortKey === key;
                th.setAttribute('aria-sort', active ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none');
                const indicator = th.querySelector('.sort-indicator');
                if (indicator) {
                    indicator.textContent = active ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';
                }
            });
        }

        // Modal handlers
        document.getElementById('closeMessageModal').addEventListener('click', () => {
            document.getElementById('messageModal').style.display = 'none';
        });

        document.getElementById('messageModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('messageModal')) {
                document.getElementById('messageModal').style.display = 'none';
            }
        });

        // Resend failed message handler
        document.getElementById('messagesBody').addEventListener('click', async (e) => {
            if (e.target.classList.contains('resend-btn')) {
                const messageId = e.target.dataset.messageId;

                if (!confirm('Are you sure you want to resend this message?')) {
                    return;
                }

                e.target.disabled = true;
                e.target.textContent = 'Sending...';

                try {
                    const response = await window.apiClient.resendSms(messageId);

                    if (response.error) {
                        showToast('Failed to resend message: ' + extractErrorMessage(response.error), 'error');
                        e.target.disabled = false;
                        e.target.textContent = 'Resend';
                    } else {
                        showToast('Message resent successfully!', 'success');
                        loadMessageHistory();
                    }
                } catch (error) {
                    console.error('Resend error:', error);
                    showToast('Failed to resend message: ' + extractErrorMessage(error), 'error');
                    e.target.disabled = false;
                    e.target.textContent = 'Resend';
                }
            }
        });

        // Logout function
        function logout() {
            const storage = window.getStorage ? window.getStorage() : localStorage;
            storage.removeItem('authToken');
            storage.removeItem('userName');
            storage.removeItem('userEmail');
            window.location.href = '../auth/login.html';
        }

    </script>

    <style>
        /* Additional styles for History page */
        .history-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-mini {
            background-color: var(--neutral-white);
            padding: 1.25rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .stat-mini-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-mini-icon svg {
            width: 24px;
            height: 24px;
        }

        .stat-mini-icon {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
        }

        .stat-mini-icon svg {
            color: #1976d2;
        }

        .stat-mini-icon.delivered {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
        }

        .stat-mini-icon.delivered svg {
            color: #388e3c;
        }

        .stat-mini-icon.pending {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
        }

        .stat-mini-icon.pending svg {
            color: #f57c00;
        }

        .stat-mini-icon.failed {
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
        }

        .stat-mini-icon.failed svg {
            color: #c62828;
        }

        .stat-mini-content {
            display: flex;
            flex-direction: column;
        }

        .stat-mini-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .stat-mini-label {
            font-size: 0.85rem;
            color: #999;
        }

        .actions-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .search-wrapper {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-wrapper svg {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: #999;
        }

        .search-wrapper input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 0.95rem;
            background-color: var(--neutral-white);
            transition: all 0.3s ease;
        }

        .search-wrapper input:focus {
            outline: none;
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 3px rgba(247, 127, 0, 0.1);
        }

        .filter-wrapper select {
            padding: 0.875rem 1rem;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 0.95rem;
            background-color: var(--neutral-white);
            min-width: 140px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-wrapper select:focus {
            outline: none;
            border-color: var(--accent-orange);
        }

        .history-card {
            background-color: var(--neutral-white);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
        }

        .history-table th {
            padding: 1rem 1.5rem;
            text-align: left;
            background-color: #fafafa;
            color: #666;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #f0f0f0;
        }

        .history-table td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #f8f8f8;
            color: #444;
            font-size: 0.95rem;
        }

        .history-table tbody tr {
            transition: background-color 0.3s ease;
        }

        .history-table tbody tr:hover {
            background-color: #fafafa;
        }

        .message-date {
            white-space: nowrap;
            color: #666;
            font-size: 0.9rem;
        }

        .message-sender {
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--primary-dark);
        }

        .message-recipient {
            font-family: monospace;
            font-size: 0.9rem;
        }

        .message-text {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Status badges */
        .status-badge {
            display: inline-block;
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: capitalize;
        }

        .status-badge.delivered {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .status-badge.sent {
            background-color: #e3f2fd;
            color: #1565c0;
        }

        .status-badge.failed {
            background-color: #ffebee;
            color: #c62828;
        }

        .status-badge.processing {
            background-color: #fff3e0;
            color: #ef6c00;
        }

        .status-badge.queued {
            background-color: #f5f5f5;
            color: #616161;
        }

        .status-badge.scheduled {
            background-color: #f3e5f5;
            color: #7b1fa2;
        }

        .status-badge.cancelled {
            background-color: #e0e0e0;
            color: #424242;
        }

        /* Resend button */
        .resend-btn {
            padding: 0.35rem 0.85rem;
            background-color: #fff3e0;
            color: #f57c00;
            border: 1px solid #ffb74d;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .resend-btn:hover {
            background-color: #ffe0b2;
        }

        .resend-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message-actions {
            white-space: nowrap;
        }

        /* Modal styles */
        .modal-large {
            max-width: 600px;
        }

        .message-detail-content {
            padding: 1rem 0;
        }

        .detail-row {
            display: flex;
            padding: 1rem 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            width: 120px;
            font-weight: 600;
            color: #666;
            flex-shrink: 0;
        }

        .detail-value {
            flex: 1;
            color: var(--primary-dark);
            word-break: break-word;
        }

        .detail-value.message-full {
            background-color: #f5f5f5;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 0.5rem;
            font-family: monospace;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .actions-bar {
                flex-direction: column;
            }

            .search-wrapper {
                min-width: 100%;
            }

            .filter-wrapper {
                width: 100%;
            }

            .filter-wrapper select {
                width: 100%;
            }

            .history-table {
                display: block;
                overflow-x: auto;
            }

            .detail-row {
                flex-direction: column;
            }

            .detail-label {
                width: 100%;
                margin-bottom: 0.5rem;
            }
        }

        /* Sortable column headers */
        .history-table th.sortable {
            cursor: pointer;
            user-select: none;
            position: relative;
            padding-right: 1.5rem;
        }

        .history-table th.sortable:hover {
            background-color: #f5f5f5;
            color: var(--primary-dark);
        }

        .history-table th.sortable[aria-sort="ascending"],
        .history-table th.sortable[aria-sort="descending"] {
            color: var(--accent-orange);
        }

        .sort-indicator {
            margin-left: 0.35rem;
            font-size: 0.7rem;
            opacity: 0.5;
        }

        .history-table th.sortable[aria-sort="ascending"] .sort-indicator,
        .history-table th.sortable[aria-sort="descending"] .sort-indicator {
            opacity: 1;
        }

        /* Pagination */
        .history-pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #f0f0f0;
            flex-wrap: wrap;
        }

        .pagination-info {
            font-size: 0.875rem;
            color: #666;
        }

        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .pagination-btn {
            padding: 0.5rem 0.875rem;
            border: 1px solid #d1d5db;
            background: var(--neutral-white);
            border-radius: 8px;
            font-size: 0.875rem;
            color: var(--primary-dark);
            cursor: pointer;
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-btn:not(:disabled):hover {
            border-color: var(--accent-orange);
            color: var(--accent-orange);
        }

        .pagination-num {
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db;
            background: var(--neutral-white);
            border-radius: 8px;
            font-size: 0.875rem;
            color: var(--primary-dark);
            cursor: pointer;
        }

        .pagination-num:hover:not(.active) {
            border-color: var(--accent-orange);
            color: var(--accent-orange);
        }

        .pagination-num.active {
            background: var(--accent-orange);
            border-color: var(--accent-orange);
            color: #fff;
        }

        /* Mobile 390px: filters stack, table scrollable in its own container */
        @media (max-width: 390px) {
            .actions-bar {
                flex-direction: column !important;
                gap: 0.75rem !important;
            }

            .search-wrapper {
                min-width: 100% !important;
                width: 100% !important;
            }

            .filter-wrapper {
                min-width: 100% !important;
                width: 100% !important;
            }

            .filter-wrapper select {
                width: 100% !important;
            }

            .table-container {
                overflow-x: auto !important;
                -webkit-overflow-scrolling: touch;
            }

            .history-table {
                min-width: 620px !important;
            }

            .history-stats {
                grid-template-columns: 1fr !important;
                gap: 0.75rem !important;
            }

            .stat-mini {
                padding: 1rem !important;
                gap: 0.75rem !important;
            }

            .stat-mini-value {
                font-size: 1.25rem !important;
            }

            .history-pagination {
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 0.75rem !important;
            }

            .pagination-controls {
                flex-direction: row !important;
                justify-content: center !important;
                flex-wrap: wrap !important;
            }

            .pagination-info {
                order: -1;
                text-align: center;
                width: 100%;
            }
        }
    </style>
</body>
</html>
