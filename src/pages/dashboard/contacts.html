<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - Nedhub Bulk Messaging</title>
    <link rel="icon" type="image/png" href="../../assets/images/Nedhubsymbol.PNG">
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../styles/dashboard.css">
    <script src="../../utils/api.js" defer></script>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../../assets/images/Nedhublogo.PNG" alt="Nedhub Logo" class="sidebar-logo">
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="overview.html">Overview</a></li>
                    <li><a href="send-sms.html">Send SMS</a></li>
                    <li><a href="contacts.html" class="active">Contacts</a></li>
                    <li><a href="history.html">Message History</a></li>
                    <li><a href="reports.html">Reports</a></li>
                    <li><a href="settings.html">Settings</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header class="top-nav">
                <div class="user-info">
                    <span>Welcome, User</span>
                </div>
            </header>
            <div class="dashboard-content">
                <h2>Contacts</h2>
                <div class="contacts-header">
                    <button class="btn-primary" id="addContactBtn">Add Contact</button>
                    <input type="text" placeholder="Search contacts..." class="search-input">
                </div>
                <table class="contacts-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Group</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>John Doe</td>
                            <td>+233123456789</td>
                            <td>Customers</td>
                            <td><button class="btn-secondary">Edit</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    
    <!-- Add Contact Modal -->
    <div class="modal" id="contactModal">
        <div class="modal-content">
            <span class="close" id="closeContactModal">&times;</span>
            <h3 id="contactModalTitle">Add Contact</h3>
            <form id="contactForm">
                <input type="hidden" id="contactId">
                <div class="form-group">
                    <label for="contactName">Name</label>
                    <input type="text" id="contactName" name="name" required>
                </div>
                <div class="form-group">
                    <label for="contactPhone">Phone Number</label>
                    <input type="text" id="contactPhone" name="phoneNumber" required>
                </div>
                <div class="form-group">
                    <label for="contactGroup">Group</label>
                    <input type="text" id="contactGroup" name="groupName" placeholder="e.g., Customers">
                </div>
                <button type="submit" class="btn-primary" id="contactSubmitBtn">Add Contact</button>
            </form>
        </div>
    </div>
    
    <script>
        let contacts = [];
        
        document.getElementById('addContactBtn').addEventListener('click', () => {
            document.getElementById('contactModalTitle').textContent = 'Add Contact';
            document.getElementById('contactSubmitBtn').textContent = 'Add Contact';
            document.getElementById('contactForm').reset();
            document.getElementById('contactId').value = '';
            document.getElementById('contactModal').style.display = 'block';
        });
        
        document.getElementById('closeContactModal').addEventListener('click', () => {
            document.getElementById('contactModal').style.display = 'none';
        });
        
        window.addEventListener('click', (event) => {
            if (event.target === document.getElementById('contactModal')) {
                document.getElementById('contactModal').style.display = 'none';
            }
        });
        
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const contactId = document.getElementById('contactId').value;
            const name = document.getElementById('contactName').value;
            const phoneNumber = document.getElementById('contactPhone').value;
            const groupName = document.getElementById('contactGroup').value;
            const submitBtn = document.getElementById('contactSubmitBtn');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving...';
            
            try {
                let result;
                if (contactId) {
                    result = await window.apiClient.updateContact(contactId, name, phoneNumber, groupName);
                } else {
                    result = await window.apiClient.createContact(name, phoneNumber, groupName);
                }
                
                if (result.error) {
                    alert(result.error);
                } else {
                    alert(contactId ? 'Contact updated successfully!' : 'Contact added successfully!');
                    document.getElementById('contactModal').style.display = 'none';
                    loadContacts();
                }
            } catch (error) {
                console.error('Contact error:', error);
                alert('An error occurred. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Save Contact';
            }
        });
        
        async function loadContacts() {
            try {
                const result = await window.apiClient.getContacts();
                if (result.error) {
                    console.error(result.error);
                    return;
                }
                contacts = result.data || [];
                const tbody = document.querySelector('.contacts-table tbody');
                tbody.innerHTML = '';
                
                contacts.forEach(contact => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${contact.name}</td>
                        <td>${contact.phoneNumber}</td>
                        <td>${contact.groupName || 'Ungrouped'}</td>
                        <td>
                            <button class="btn-secondary edit-btn" data-id="${contact._id}">Edit</button>
                            <button class="btn-danger delete-btn" data-id="${contact._id}">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
                
                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = e.target.getAttribute('data-id');
                        const contact = contacts.find(c => c._id === id);
                        if (contact) {
                            document.getElementById('contactId').value = id;
                            document.getElementById('contactName').value = contact.name;
                            document.getElementById('contactPhone').value = contact.phoneNumber;
                            document.getElementById('contactGroup').value = contact.groupName || '';
                            document.getElementById('contactModalTitle').textContent = 'Edit Contact';
                            document.getElementById('contactSubmitBtn').textContent = 'Update Contact';
                            document.getElementById('contactModal').style.display = 'block';
                        }
                    });
                });
                
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.getAttribute('data-id');
                        if (confirm('Are you sure you want to delete this contact?')) {
                            try {
                                const result = await window.apiClient.deleteContact(id);
                                if (result.error) {
                                    alert(result.error);
                                } else {
                                    alert('Contact deleted successfully!');
                                    loadContacts();
                                }
                            } catch (error) {
                                alert('An error occurred.');
                            }
                        }
                    });
                });
            } catch (error) {
                console.error('Error loading contacts:', error);
            }
        }
        
        // Search functionality
        document.querySelector('.search-input').addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase();
            const filtered = contacts.filter(c => 
                c.name.toLowerCase().includes(searchTerm) || 
                c.phoneNumber.includes(searchTerm) ||
                (c.groupName && c.groupName.toLowerCase().includes(searchTerm))
            );
            const tbody = document.querySelector('.contacts-table tbody');
            tbody.innerHTML = '';
            filtered.forEach(contact => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${contact.name}</td>
                    <td>${contact.phoneNumber}</td>
                    <td>${contact.groupName || 'Ungrouped'}</td>
                    <td>
                        <button class="btn-secondary edit-btn" data-id="${contact._id}">Edit</button>
                        <button class="btn-danger delete-btn" data-id="${contact._id}">Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        });
        
        // Load contacts on page load
        loadContacts();
    </script>
</body>
</html>
