<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message History - Nedhub Bulk Messaging</title>
    <link rel="icon" type="image/png" href="../../assets/images/Nedhubsymbol.PNG">
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../styles/dashboard.css">
    <link rel="stylesheet" href="../../styles/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400,500,700,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/nedhub-app.css">
    <script src="../../utils/authStorage.js"></script>
    <script src="../../utils/api.js" defer></script>
    <script src="../../utils/toast.js" defer></script>
    <script src="../../utils/escape.js"></script>
    <link rel="stylesheet" href="../../styles/shell.css?v=1">
</head>
<body class="nhs-has-shell">
    <div class="dashboard-layout">
        <div id="nhs-sidebar-mount"></div>
        <main class="main-content">
            <div id="nhs-topbar-mount"></div>
    <script src="../../utils/shell.js?v=1"></script>
            <!-- Sidebar Overlay -->
            <div class="dashboard-content">
                <div class="welcome-section">
                    <h2 id="pageTitle">Message History</h2>
                    <p class="welcome-subtitle">View all your sent messages and their delivery status</p>
                </div>

                <!-- Stats Row -->
                <div class="history-stats">
                    <div class="stat-mini">
                        <div class="stat-mini-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
                            </svg>
                        </div>
                        <div class="stat-mini-content">
                            <span class="stat-mini-value" id="totalMessages">0</span>
                            <span class="stat-mini-label">Total Messages</span>
                        </div>
                    </div>
                    <div class="stat-mini">
                        <div class="stat-mini-icon delivered">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                        </div>
                        <div class="stat-mini-content">
                            <span class="stat-mini-value" id="deliveredCount">0</span>
                            <span class="stat-mini-label">Delivered</span>
                        </div>
                    </div>
                    <div class="stat-mini">
                        <div class="stat-mini-icon queued">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 16 14"></polyline>
                            </svg>
                        </div>
                        <div class="stat-mini-content">
                            <span class="stat-mini-value" id="queuedCount">0</span>
                            <span class="stat-mini-label">Queued</span>
                        </div>
                    </div>
                    <div class="stat-mini">
                        <div class="stat-mini-icon failed">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="15" y1="9" x2="9" y2="15"></line>
                                <line x1="9" y1="9" x2="15" y2="15"></line>
                            </svg>
                        </div>
                        <div class="stat-mini-content">
                            <span class="stat-mini-value" id="failedCount">0</span>
                            <span class="stat-mini-label">Failed</span>
                        </div>
                    </div>
                </div>

                <!-- Actions Bar -->
                <div class="actions-bar">
                    <div class="search-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="searchInput" placeholder="Search by recipient, message, or status...">
                    </div>
                    <div class="filter-wrapper">
                        <select id="statusFilter">
                            <option value="">All Status</option>
                            <option value="delivered">Delivered</option>
                            <option value="sent">Sent</option>
                            <option value="processing">Processing</option>
                            <option value="queued">Queued</option>
                            <option value="failed">Failed</option>
                            <option value="scheduled">Scheduled</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div class="filter-wrapper">
                        <select id="dateFilter">
                            <option value="">All Time</option>
                            <option value="today">Today</option>
                            <option value="week">This Week</option>
                            <option value="month">This Month</option>
                        </select>
                    </div>
                </div>

                <!-- Messages Table Card -->
                <div class="history-card">
                    <div class="table-container">
                        <table class="history-table">
                            <thead>
                                <tr>
                                    <th>Date & Time</th>
                                    <th>Sender ID</th>
                                    <th>Recipient</th>
                                    <th>Message</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="messagesBody">
                                <!-- Messages will be loaded here -->
                            </tbody>
                        </table>
                        <div class="loading-spinner" id="loadingSpinner">
                            <div class="spinner"></div>
                            <p>Loading message history...</p>
                        </div>
                        <div class="empty-state" id="emptyState" style="display: none;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
                            </svg>
                            <p>No messages yet</p>
                            <span>Your sent messages will appear here</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Message Detail Modal -->
    <div class="modal" id="messageModal">
        <div class="modal-content modal-large">
            <button class="modal-close" id="closeMessageModal">&times;</button>
            <div class="modal-header">
                <div class="modal-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
                    </svg>
                </div>
                <h3>Message Details</h3>
            </div>
            <div class="message-detail-content" id="messageDetailContent">
                <!-- Message details will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        let messages = [];
        let filteredMessages = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuthAndLoad();
        });

        async function checkAuthAndLoad() {
            const token = window.getStorage ? window.getStorage().getItem('authToken') : localStorage.getItem('authToken');
            console.log('[AuthBootstrap] [Dashboard] checkAuthAndLoad - token present:', !!token);
            if (!token) {
                window.location.href = '../auth/login.html';
                return;
            }

            await loadUserProfile();
            await loadMessageHistory();
        }

        async function loadUserProfile() {
            try {
                const storage = window.getStorage ? window.getStorage() : localStorage;
                const response = await window.apiClient.getUserProfile();
                if (response.error) {
                    useStoredUserName();
                    return;
                }
                
                if (response.data && response.data.user) {
                    const user = response.data.user;
                    const firstName = user.name ? user.name.split(' ')[0] : 'User';
                    updateUserDisplay(firstName);
                    storage.setItem('userName', user.name);
                } else {
                    useStoredUserName();
                }
            } catch (error) {
                console.error('Error loading user profile:', error);
                useStoredUserName();
            }
        }

        function useStoredUserName() {
            const storage = window.getStorage ? window.getStorage() : localStorage;
            const storedName = storage.getItem('userName');
            if (storedName) {
                const firstName = storedName.split(' ')[0];
                updateUserDisplay(firstName);
            } else {
                updateUserDisplay('User');
            }
        }

        function updateUserDisplay(firstName) {
            const userNameEl = document.getElementById('userName');
            const userAvatarEl = document.getElementById('userAvatar');
            
            if (userNameEl) userNameEl.textContent = firstName;
            if (userAvatarEl) userAvatarEl.textContent = (firstName.charAt(0) || 'U').toUpperCase();
        }

        async function loadMessageHistory() {
            const spinner = document.getElementById('loadingSpinner');
            const emptyState = document.getElementById('emptyState');
            const tbody = document.getElementById('messagesBody');
            const totalMessagesEl = document.getElementById('totalMessages');
            const deliveredCountEl = document.getElementById('deliveredCount');
            const queuedCountEl = document.getElementById('queuedCount');
            const failedCountEl = document.getElementById('failedCount');
            
            if (!tbody) return;
            
            try {
                spinner.style.display = 'flex';
                tbody.innerHTML = '';
                
                const result = await window.apiClient.getMessageHistory();
                
                spinner.style.display = 'none';
                
                if (result.error) {
                    console.error('[MessageHistory] Error:', result.error);
                    tbody.innerHTML = '<tr><td colspan="5" class="error">Failed to load message history</td></tr>';
                    return;
                }
                
                const responseData = result.data;
                messages = responseData.messages || [];
                filteredMessages = [...messages];
                
                // Use summary from API for accurate counts
                const summary = responseData.summary || {};
                
                // Update stats with canonical status counts
                if (totalMessagesEl) totalMessagesEl.textContent = summary.total || messages.length;
                if (deliveredCountEl) deliveredCountEl.textContent = summary.delivered || 0;
                if (queuedCountEl) queuedCountEl.textContent = summary.queued || messages.filter(m => m.status === 'queued').length;
                if (failedCountEl) failedCountEl.textContent = summary.failed || 0;
                
                if (messages.length > 0) {
                    renderMessages(messages);
                } else {
                    emptyState.style.display = 'flex';
                }
            } catch (error) {
                spinner.style.display = 'none';
                console.error('[MessageHistory] Error loading history:', error);
                tbody.innerHTML = '<tr><td colspan="5" class="error">Failed to load message history</td></tr>';
            }
        }

        function renderMessages(messagesToRender) {
            const tbody = document.getElementById('messagesBody');
            const emptyState = document.getElementById('emptyState');
            
            if (!tbody) return;
            
            tbody.innerHTML = '';
            
            if (messagesToRender.length === 0) {
                emptyState.style.display = 'flex';
                return;
            }
            
            emptyState.style.display = 'none';
            
            messagesToRender.forEach(msg => {
                const row = document.createElement('tr');
                const date = msg.createdAt ? new Date(msg.createdAt).toLocaleString() : '-';
                const messagePreview = msg.message ? msg.message.substring(0, 60) + (msg.message.length > 60 ? '...' : '') : '-';
                
                row.innerHTML = `
                    <td class="message-date">${date}</td>
                    <td class="message-sender">${escapeHtml(msg.senderId || '-')}</td>
                    <td class="message-recipient">${escapeHtml(msg.recipient || '-')}</td>
                    <td class="message-text">${escapeHtml(messagePreview)}</td>
                    <td><span class="status-badge ${getStatusClass(msg.status)}">${escapeHtml(formatStatus(msg.status))}</span></td>
                    <td class="message-actions">
                        ${msg.status === 'failed' && msg.source === 'new' ? `<button class="resend-btn" data-message-id="${escapeAttr(msg._id)}" title="Resend Failed Message">Resend</button>` : ''}
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function getStatusClass(status) {
          switch (status?.toLowerCase()) {
            case 'delivered':
              return 'delivered';
            case 'sent':
              return 'sent';
            case 'processing':
              return 'processing';
            case 'queued':
              return 'queued';
            case 'failed':
              return 'failed';
            case 'scheduled':
              return 'scheduled';
            case 'cancelled':
              return 'cancelled';
            default:
              return 'queued'; // Safe default to avoid false failed
          }
        }

        function formatStatus(status) {
            if (!status) return 'Unknown';
            return status.charAt(0).toUpperCase() + status.slice(1);
        }

        // Search and filter functionality
        document.getElementById('searchInput').addEventListener('input', function() {
            filterMessages();
        });

        document.getElementById('statusFilter').addEventListener('change', function() {
            filterMessages();
        });

        document.getElementById('dateFilter').addEventListener('change', function() {
            filterMessages();
        });

        function filterMessages() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const dateFilter = document.getElementById('dateFilter').value;
            const now = new Date();
            
            filteredMessages = messages.filter(msg => {
                // Search filter
                const matchesSearch = 
                    (msg.recipient && msg.recipient.toLowerCase().includes(searchTerm)) ||
                    (msg.message && msg.message.toLowerCase().includes(searchTerm)) ||
                    (msg.senderId && msg.senderId.toLowerCase().includes(searchTerm)) ||
                    (msg.status && msg.status.toLowerCase().includes(searchTerm));
                
                // Status filter
                const matchesStatus = !statusFilter || msg.status?.toLowerCase() === statusFilter;
                
                // Date filter
                let matchesDate = true;
                if (dateFilter && msg.createdAt) {
                    const msgDate = new Date(msg.createdAt);
                    if (dateFilter === 'today') {
                        matchesDate = msgDate.toDateString() === now.toDateString();
                    } else if (dateFilter === 'week') {
                        const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                        matchesDate = msgDate >= weekAgo;
                    } else if (dateFilter === 'month') {
                        const monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
                        matchesDate = msgDate >= monthAgo;
                    }
                }
                
                return matchesSearch && matchesStatus && matchesDate;
            });
            
            renderMessages(filteredMessages);
        }

        // Modal handlers
        document.getElementById('closeMessageModal').addEventListener('click', () => {
            document.getElementById('messageModal').style.display = 'none';
        });

        document.getElementById('messageModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('messageModal')) {
                document.getElementById('messageModal').style.display = 'none';
            }
        });

        // Resend failed message handler
        document.getElementById('messagesBody').addEventListener('click', async (e) => {
            if (e.target.classList.contains('resend-btn')) {
                const messageId = e.target.dataset.messageId;
                
                if (!confirm('Are you sure you want to resend this message?')) {
                    return;
                }

                // Show loading state
                e.target.disabled = true;
                e.target.textContent = 'Sending...';

                try {
                    const response = await window.apiClient.resendSms(messageId);
                    
                    if (response.error) {
                        showToast('Failed to resend message: ' + extractErrorMessage(response.error), 'error');
                        e.target.disabled = false;
                        e.target.textContent = 'Resend';
                    } else {
                        showToast('Message resent successfully!', 'success');
                        // Refresh message history
                        loadMessageHistory();
                    }
                } catch (error) {
                    console.error('Resend error:', error);
                     showToast('Failed to resend message: ' + extractErrorMessage(error), 'error');
                    e.target.disabled = false;
                    e.target.textContent = 'Resend';
                }
            }
        });

        // Logout function
        function logout() {
            const storage = window.getStorage ? window.getStorage() : localStorage;
            storage.removeItem('authToken');
            storage.removeItem('userName');
            storage.removeItem('userEmail');
            window.location.href = '../auth/login.html';
        }

    </script>

    <style>
        /* Additional styles for History page */
        .history-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-mini {
            background-color: var(--neutral-white);
            padding: 1.25rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .stat-mini-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-mini-icon svg {
            width: 24px;
            height: 24px;
        }

        .stat-mini-icon {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
        }

        .stat-mini-icon svg {
            color: #1976d2;
        }

        .stat-mini-icon.delivered {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
        }

        .stat-mini-icon.delivered svg {
            color: #388e3c;
        }

        .stat-mini-icon.pending {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
        }

        .stat-mini-icon.pending svg {
            color: #f57c00;
        }

        .stat-mini-icon.failed {
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
        }

        .stat-mini-icon.failed svg {
            color: #c62828;
        }

        .stat-mini-content {
            display: flex;
            flex-direction: column;
        }

        .stat-mini-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .stat-mini-label {
            font-size: 0.85rem;
            color: #999;
        }

        .actions-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .search-wrapper {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-wrapper svg {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: #999;
        }

        .search-wrapper input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 0.95rem;
            background-color: var(--neutral-white);
            transition: all 0.3s ease;
        }

        .search-wrapper input:focus {
            outline: none;
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 3px rgba(247, 127, 0, 0.1);
        }

        .filter-wrapper select {
            padding: 0.875rem 1rem;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 0.95rem;
            background-color: var(--neutral-white);
            min-width: 140px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-wrapper select:focus {
            outline: none;
            border-color: var(--accent-orange);
        }

        .history-card {
            background-color: var(--neutral-white);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
        }

        .history-table th {
            padding: 1rem 1.5rem;
            text-align: left;
            background-color: #fafafa;
            color: #666;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #f0f0f0;
        }

        .history-table td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #f8f8f8;
            color: #444;
            font-size: 0.95rem;
        }

        .history-table tbody tr {
            transition: background-color 0.3s ease;
        }

        .history-table tbody tr:hover {
            background-color: #fafafa;
        }

        .message-date {
            white-space: nowrap;
            color: #666;
            font-size: 0.9rem;
        }

        .message-sender {
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--primary-dark);
        }

        .message-recipient {
            font-family: monospace;
            font-size: 0.9rem;
        }

        .message-text {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Status badges */
        .status-badge {
            display: inline-block;
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: capitalize;
        }

        .status-badge.delivered {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .status-badge.sent {
            background-color: #e3f2fd;
            color: #1565c0;
        }

        .status-badge.failed {
            background-color: #ffebee;
            color: #c62828;
        }

        .status-badge.processing {
            background-color: #fff3e0;
            color: #ef6c00;
        }

        .status-badge.queued {
            background-color: #f5f5f5;
            color: #616161;
        }

        .status-badge.scheduled {
            background-color: #f3e5f5;
            color: #7b1fa2;
        }

        .status-badge.cancelled {
            background-color: #e0e0e0;
            color: #424242;
        }

        /* Resend button */
        .resend-btn {
            padding: 0.35rem 0.85rem;
            background-color: #fff3e0;
            color: #f57c00;
            border: 1px solid #ffb74d;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .resend-btn:hover {
            background-color: #ffe0b2;
        }

        .resend-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message-actions {
            white-space: nowrap;
        }

        /* Modal styles */
        .modal-large {
            max-width: 600px;
        }

        .message-detail-content {
            padding: 1rem 0;
        }

        .detail-row {
            display: flex;
            padding: 1rem 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            width: 120px;
            font-weight: 600;
            color: #666;
            flex-shrink: 0;
        }

        .detail-value {
            flex: 1;
            color: var(--primary-dark);
            word-break: break-word;
        }

        .detail-value.message-full {
            background-color: #f5f5f5;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 0.5rem;
            font-family: monospace;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .actions-bar {
                flex-direction: column;
            }

            .search-wrapper {
                min-width: 100%;
            }

            .filter-wrapper {
                width: 100%;
            }

            .filter-wrapper select {
                width: 100%;
            }

            .history-table {
                display: block;
                overflow-x: auto;
            }

            .detail-row {
                flex-direction: column;
            }

            .detail-label {
                width: 100%;
                margin-bottom: 0.5rem;
            }
        }
    </style>
</body>
</html>
