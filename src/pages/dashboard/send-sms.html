<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send SMS - Nedhub Bulk Messaging</title>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../styles/dashboard.css">
    <script src="../../utils/api.js" defer></script>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../../assets/images/Nedhublogo.PNG" alt="Nedhub Logo" class="sidebar-logo">
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="overview.html">Overview</a></li>
                    <li><a href="send-sms.html" class="active">Send SMS</a></li>
                    <li><a href="contacts.html">Contacts</a></li>
                    <li><a href="history.html">Message History</a></li>
                    <li><a href="reports.html">Reports</a></li>
                    <li><a href="settings.html">Settings</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header class="top-nav">
                <div class="user-info">
                    <span>Welcome, User</span>
                </div>
            </header>
            <div class="dashboard-content">
                <h2>Send SMS</h2>
                <form id="sendSmsForm">
                    <div class="form-group">
                        <label for="senderId">Sender ID</label>
                        <input type="text" id="senderId" name="senderId" required>
                    </div>
                    <div class="form-group">
                        <label for="recipients">Recipients</label>
                        <textarea id="recipients" name="recipients" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                        <div class="char-counter">Characters: <span id="charCount">0</span></div>
                    </div>
                    <button type="submit" class="btn-primary">Send SMS</button>
                </form>
            </div>
        </main>
    </div>
    <script>
        document.getElementById('sendSmsForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const senderId = document.getElementById('senderId').value;
            const recipients = document.getElementById('recipients').value.split(',').map(r => r.trim());
            const message = document.getElementById('message').value;
            const submitBtn = this.querySelector('button[type="submit"]');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            
            try {
                const result = await window.apiClient.sendSMS(senderId, recipients, message);
                
                if (result.error) {
                    alert(result.error);
                } else {
                    alert('SMS sent successfully!');
                    this.reset();
                    document.getElementById('charCount').textContent = '0';
                }
            } catch (error) {
                console.error('SMS error:', error);
                alert('An error occurred. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send SMS';
            }
        });
        
        // Character counter
        document.getElementById('message').addEventListener('input', function() {
            document.getElementById('charCount').textContent = this.value.length;
        });
    </script>
</body>
</html>
