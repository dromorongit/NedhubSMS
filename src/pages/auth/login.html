<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nedhub Bulk Messaging</title>
    <link rel="icon" type="image/png" href="../../assets/images/Nedhubsymbol.PNG">
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../styles/auth.css">
    <script src="../../utils/api.js" defer></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="../../assets/images/Nedhublogo.PNG" alt="Nedhub Logo" class="logo-img">
            </div>
            <h1>Welcome Back</h1>
            <p>Sign in to your Nedhub account</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>
            <p class="auth-footer">
                <a href="forgot-password.html">Forgot password?</a>
                <span>Don't have an account? <a href="register.html">Sign up</a></span>
            </p>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = this.querySelector('button[type="submit"]');
            
            // Disable button during request
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';
            
            try {
                const result = await window.apiClient.login(email, password);
                
                if (result.error) {
                    alert(result.error);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                } else {
                    // Login successful - store token and redirect
                    window.apiClient.setToken(result.data.token);
                    window.location.href = '../dashboard/overview.html';
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('An error occurred. Please try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
