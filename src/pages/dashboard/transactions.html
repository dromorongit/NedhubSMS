<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - Nedhub Bulk Messaging</title>
    <link rel="icon" type="image/png" href="../../assets/images/Nedhubsymbol.PNG">
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../styles/dashboard.css">
    <link rel="stylesheet" href="../../styles/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400,500,700,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/nedhub-app.css">
    <link rel="stylesheet" href="../../styles/shell.css?v=1">
</head>
<body class="nhs-has-shell">
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <div id="nhs-sidebar-mount"></div>
        
        <main class="main-content">
            <div id="nhs-topbar-mount"></div>
    <script src="../../utils/shell.js?v=1"></script>
            
            <!-- Sidebar Overlay -->
            
            <div class="dashboard-content">
                <div class="page-header">
                    <h2>Transactions</h2>
                    <p class="page-subtitle">View all your wallet transactions</p>
                </div>

                <!-- Filter Section -->
                <div class="filter-section">
                    <div class="filter-group">
                        <label>Filter by Type:</label>
                        <select id="typeFilter">
                            <option value="">All Types</option>
                            <option value="credit">Credits</option>
                            <option value="debit">Debits</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Status:</label>
                        <select id="statusFilter">
                            <option value="">All Status</option>
                            <option value="completed">Completed</option>
                            <option value="pending">Pending</option>
                            <option value="failed">Failed</option>
                        </select>
                    </div>
                </div>

                <!-- Transactions Table -->
                <div class="table-container">
                    <table class="transactions-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Type</th>
                                <th>Amount</th>
                                <th>Description</th>
                                <th>Status</th>
                                <th>Reference</th>
                            </tr>
                        </thead>
                        <tbody id="transactionsBody">
                            <!-- Transactions will be loaded here -->
                        </tbody>
                    </table>
                    
                    <div class="loading-spinner" id="loadingSpinner">
                        <div class="spinner"></div>
                        <p>Loading transactions...</p>
                    </div>
                    
                    <div class="empty-state" id="emptyState" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                            <line x1="1" y1="10" x2="23" y2="10"></line>
                        </svg>
                        <p>No transactions yet</p>
                        <span>Your wallet transactions will appear here</span>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="pagination" id="pagination" style="display: none;">
                    <button class="pagination-btn" id="prevPage" disabled>Previous</button>
                    <span class="page-info" id="pageInfo">Page 1 of 1</span>
                    <button class="pagination-btn" id="nextPage" disabled>Next</button>
                </div>
            </div>
        </main>
    </div>

    <script src="../../utils/authStorage.js"></script>
    <script src="../../utils/api.js"></script>
    <script src="../../utils/toast.js"></script>
    <script src="../../utils/escape.js"></script>
    <script>
        let currentPage = 1;
        let totalPages = 1;

        document.addEventListener('DOMContentLoaded', () => {
            checkAuthAndLoad();
        });

        async function checkAuthAndLoad() {
            const token = window.getStorage ? window.getStorage().getItem('authToken') : localStorage.getItem('authToken');
            console.log('[AuthBootstrap] [Dashboard] checkAuthAndLoad - token present:', !!token);
            if (!token) {
                window.location.href = '../auth/login.html';
                return;
            }

            await loadUserProfile();
            loadTransactions();
            setupFilters();
}

        async function loadUserProfile() {
            try {
                const response = await window.apiClient.getUserProfile();
                if (response.data && response.data.user) {
                    const user = response.data.user;
                    const firstName = user.name ? user.name.split(' ')[0] : 'User';
                    document.getElementById('userName').textContent = firstName;
                    document.getElementById('userAvatar').textContent = firstName.charAt(0).toUpperCase();
                }
            } catch (error) {
                console.error('Error loading user profile:', error);
            }
        }

        async function loadTransactions(page = 1) {
            const spinner = document.getElementById('loadingSpinner');
            const emptyState = document.getElementById('emptyState');
            const tbody = document.getElementById('transactionsBody');
            const pagination = document.getElementById('pagination');
            
            spinner.style.display = 'flex';
            emptyState.style.display = 'none';
            tbody.innerHTML = '';
            
            try {
                // Use the transactions endpoint with pagination
                const response = await window.apiClient.request('GET', `/wallet/transactions?page=${page}&limit=20`);
                
                spinner.style.display = 'none';
                
                if (response.error) {
                    console.error('Error loading transactions:', response.error);
                    tbody.innerHTML = '<tr><td colspan="6" class="error">Failed to load transactions</td></tr>';
                    return;
                }
                
                const data = response.data;
                if (data && data.transactions && data.transactions.length > 0) {
                    currentPage = data.pagination.page;
                    totalPages = data.pagination.pages;
                    
                    data.transactions.forEach(tx => {
                        const row = document.createElement('tr');
                        const date = tx.createdAt ? new Date(tx.createdAt).toLocaleDateString() : '-';
                        const type = tx.type ? tx.type.charAt(0).toUpperCase() + tx.type.slice(1) : '-';
                        const amount = tx.amount ? (tx.type === 'credit' ? '+₵' : '-₵') + tx.amount.toFixed(2) : '-';
                        const description = tx.description || '-';
                        const status = tx.status || 'completed';
                        const reference = tx.reference ? tx.reference.substring(0, 15) + '...' : '-';
                        
                        row.innerHTML = `
                            <td>${date}</td>
                            <td><span class="tx-type ${escapeAttr(tx.type)}">${escapeHtml(type)}</span></td>
                            <td class="${tx.type === 'credit' ? 'text-success' : 'text-danger'}">${amount}</td>
                            <td class="description-cell">${escapeHtml(description)}</td>
                            <td><span class="status-badge ${escapeAttr(status)}">${escapeHtml(status)}</span></td>
                            <td class="reference-cell" title="${escapeAttr(tx.reference || '')}">${escapeHtml(reference)}</td>
                        `;
                        tbody.appendChild(row);
                    });
                    
                    // Show pagination
                    if (totalPages > 1) {
                        pagination.style.display = 'flex';
                        updatePagination();
                    }
                } else {
                    emptyState.style.display = 'flex';
                }
                
            } catch (error) {
                spinner.style.display = 'none';
                console.error('Error loading transactions:', error);
                tbody.innerHTML = '<tr><td colspan="6" class="error">Failed to load transactions</td></tr>';
            }
        }

        function updatePagination() {
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevPage').disabled = currentPage <= 1;
            document.getElementById('nextPage').disabled = currentPage >= totalPages;
        }

        function setupFilters() {
            document.getElementById('typeFilter').addEventListener('change', () => {
                filterTransactions();
            });
            
            document.getElementById('statusFilter').addEventListener('change', () => {
                filterTransactions();
            });
            
            document.getElementById('prevPage').addEventListener('click', () => {
                if (currentPage > 1) {
                    loadTransactions(currentPage - 1);
                }
            });
            
            document.getElementById('nextPage').addEventListener('click', () => {
                if (currentPage < totalPages) {
                    loadTransactions(currentPage + 1);
                }
            });
        }

        function filterTransactions() {
            const typeFilter = document.getElementById('typeFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const rows = document.querySelectorAll('#transactionsBody tr');
            
            rows.forEach(row => {
                const type = row.querySelector('.tx-type').classList.contains('credit') ? 'credit' : 'debit';
                const status = row.querySelector('.status-badge')?.classList.contains('completed') ? 'completed' : 
                               row.querySelector('.status-badge')?.classList.contains('pending') ? 'pending' : 'failed';
                
                let show = true;
                
                if (typeFilter && type !== typeFilter) {
                    show = false;
                }
                
                if (statusFilter && status !== statusFilter) {
                    show = false;
                }
                
                row.style.display = show ? '' : 'none';
            });
        }

function logout() {
            const storage = window.getStorage ? window.getStorage() : localStorage;
            storage.removeItem('authToken');
            storage.removeItem('userName');
            storage.removeItem('userEmail');
            window.location.href = '../auth/login.html';
        }
    </script>
</body>
</html>
