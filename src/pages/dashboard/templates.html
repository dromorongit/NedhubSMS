<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templates - Nedhub Bulk Messaging</title>
    <link rel="icon" type="image/png" href="../../assets/images/Nedhubsymbol.PNG">
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../styles/dashboard.css">
    <link rel="stylesheet" href="../../styles/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400,500,700,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/nedhub-app.css">
    <link rel="stylesheet" href="../../styles/shell.css?v=2">
</head>
<body class="nhs-has-shell">
    <div class="dashboard-layout">
        <div id="nhs-sidebar-mount"></div>
        <main class="main-content">
            <div id="nhs-topbar-mount"></div>
    <script src="../../utils/shell.js?v=2"></script>
            <!-- Sidebar Overlay -->
            <div class="dashboard-content">
                <h2>Message Templates</h2>
                
                <!-- Create Template Button -->
                <button class="btn-primary" id="createTemplateBtn">Create New Template</button>
                
                <!-- Templates List -->
                <div class="templates-list">
                    <h3>Your Templates</h3>
                    <table class="templates-table">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Content</th>
                                <th>Segments</th>
                                <th>Encoding</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="templatesBody">
                            <!-- Templates will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Create/Edit Template Modal -->
    <div class="modal" id="templateModal">
        <div class="modal-content">
            <span class="close" id="closeTemplateModal">&times;</span>
            <h2 id="templateModalTitle">Create New Template</h2>
            
            <form id="templateForm">
                <input type="hidden" id="templateId">
                
                <div class="form-group">
                    <label for="templateTitle">Template Title</label>
                    <input type="text" id="templateTitle" name="templateTitle" required>
                </div>
                
                <div class="form-group">
                    <label for="templateContent">Message Content</label>
                    <textarea id="templateContent" name="templateContent" rows="6" required></textarea>
                    <div class="char-counter">
                        Characters: <span id="charCount">0</span> | 
                        Segments: <span id="segmentCount">0</span> | 
                        Encoding: <span id="encodingType">GSM</span>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary" id="templateSubmitBtn">Create Template</button>
            </form>
        </div>
    </div>
    
    <script src="../../utils/api.js"></script>
    <script>
        // DOM elements
        const createTemplateBtn = document.getElementById('createTemplateBtn');
        const closeTemplateModal = document.getElementById('closeTemplateModal');
        const templateModal = document.getElementById('templateModal');
        const templateForm = document.getElementById('templateForm');
        const templateTitle = document.getElementById('templateTitle');
        const templateContent = document.getElementById('templateContent');
        const charCount = document.getElementById('charCount');
        const segmentCount = document.getElementById('segmentCount');
        const encodingType = document.getElementById('encodingType');
        const templateModalTitle = document.getElementById('templateModalTitle');
        const templateSubmitBtn = document.getElementById('templateSubmitBtn');
        const templatesBody = document.getElementById('templatesBody');
        
        let currentTemplateId = null;
        
        // Character counter and encoding detection
        templateContent.addEventListener('input', () => {
            const content = templateContent.value;
            const chars = content.length;
            charCount.textContent = chars;
            
            // Calculate segments and detect encoding
            const isGSM = /^[\u0000-\u007F]*$/.test(content);
            const segmentSize = isGSM ? 160 : 70;
            const segments = Math.ceil(chars / segmentSize);
            segmentCount.textContent = segments;
            encodingType.textContent = isGSM ? 'GSM' : 'Unicode';
        });
        
        // Open create template modal
        createTemplateBtn.addEventListener('click', () => {
            currentTemplateId = null;
            templateModalTitle.textContent = 'Create New Template';
            templateSubmitBtn.textContent = 'Create Template';
            templateForm.reset();
            charCount.textContent = '0';
            segmentCount.textContent = '0';
            encodingType.textContent = 'GSM';
            templateModal.style.display = 'block';
        });
        
        // Close modal
        closeTemplateModal.addEventListener('click', () => {
            templateModal.style.display = 'none';
        });
        
        // Close modal when clicking outside
        window.addEventListener('click', (event) => {
            if (event.target === templateModal) {
                templateModal.style.display = 'none';
            }
        });
        
        // Handle form submission
        templateForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const templateData = {
                title: templateTitle.value,
                content: templateContent.value
            };
            
            try {
                let response;
                if (currentTemplateId) {
                    // Update existing template
                    response = await window.apiClient.updateTemplate(currentTemplateId, templateData);
                } else {
                    // Create new template
                    response = await window.apiClient.createTemplate(templateData);
                }
                
                if (response.error) {
                    throw new Error(response.error);
                }
                
                alert(currentTemplateId ? 'Template updated successfully!' : 'Template created successfully!');
                templateModal.style.display = 'none';
                templateForm.reset();
                charCount.textContent = '0';
                segmentCount.textContent = '0';
                encodingType.textContent = 'GSM';
                
                // Refresh templates list
                loadTemplates();
                
            } catch (error) {
                console.error('Error saving template:', error);
                alert('Failed to save template: ' + error.message);
            }
        });
        
        // Load templates on page load
        async function loadTemplates() {
            try {
                const response = await window.apiClient.getTemplates();
                if (response.data) {
                    templatesBody.innerHTML = '';
                    
                    response.data.forEach(template => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${template.title}</td>
                            <td>${template.content.substring(0, 50)}${template.content.length > 50 ? '...' : ''}</td>
                            <td>${template.segments}</td>
                            <td>${template.encoding}</td>
                            <td>
                                <button class="btn-secondary edit-btn" data-id="${template._id}">Edit</button>
                                <button class="btn-danger delete-btn" data-id="${template._id}">Delete</button>
                            </td>
                        `;
                        templatesBody.appendChild(row);
                    });
                    
                    // Add event listeners to edit and delete buttons
                    document.querySelectorAll('.edit-btn').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            const templateId = e.target.getAttribute('data-id');
                            await loadTemplateForEditing(templateId);
                        });
                    });
                    
                    document.querySelectorAll('.delete-btn').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            const templateId = e.target.getAttribute('data-id');
                            if (confirm('Are you sure you want to delete this template?')) {
                                await deleteTemplate(templateId);
                            }
                        });
                    });
                }
            } catch (error) {
                console.error('Error loading templates:', error);
                templatesBody.innerHTML = '<tr><td colspan="5" class="error">Failed to load templates</td></tr>';
            }
        }
        
        // Load template for editing
        async function loadTemplateForEditing(templateId) {
            try {
                const response = await window.apiClient.getTemplate(templateId);
                if (response.data) {
                    currentTemplateId = templateId;
                    templateModalTitle.textContent = 'Edit Template';
                    templateSubmitBtn.textContent = 'Update Template';
                    
                    templateTitle.value = response.data.title;
                    templateContent.value = response.data.content;
                    
                    // Update counters
                    const content = response.data.content;
                    const chars = content.length;
                    charCount.textContent = chars;
                    
                    const isGSM = /^[\u0000-\u007F]*$/.test(content);
                    const segmentSize = isGSM ? 160 : 70;
                    const segments = Math.ceil(chars / segmentSize);
                    segmentCount.textContent = segments;
                    encodingType.textContent = isGSM ? 'GSM' : 'Unicode';
                    
                    templateModal.style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading template:', error);
                alert('Failed to load template: ' + error.message);
            }
        }
        
        // Delete template
        async function deleteTemplate(templateId) {
            try {
                const response = await window.apiClient.deleteTemplate(templateId);
                if (response.error) {
                    throw new Error(response.error);
                }
                
                alert('Template deleted successfully!');
                loadTemplates();
                
            } catch (error) {
                console.error('Error deleting template:', error);
                alert('Failed to delete template: ' + error.message);
            }
        }
        
        // Load templates when page loads
        document.addEventListener('DOMContentLoaded', loadTemplates);

    </script>
</body>
</html>
