<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions - Nedhub Bulk Messaging</title>
<link rel="icon" type="image/png" href="../../assets/images/Nedhubsymbol.PNG">
<link rel="stylesheet" href="../../styles/main.css">
<link rel="stylesheet" href="../../styles/dashboard.css">
<link rel="stylesheet" href="../../styles/responsive.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400,500,700,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles/nedhub-app.css">
<link rel="stylesheet" href="../../styles/shell.css?v=2">
<style>
.page-bg{position:fixed;inset:0;pointer-events:none;z-index:0;background:#F7F9FD}
.page-header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.tx-icon-circle{width:88px;height:88px;border-radius:50%;background:#EAF7EE;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tx-icon-circle svg{width:40px;height:40px;color:#16A34A}
.page-header h1{font-size:40px;font-weight:800;color:#0F1B3D;margin:0}
.page-header p{color:#6B7280;margin:4px 0 0}
.date-wrap{margin-left:auto;position:relative}
.date-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #E5E7EB;border-radius:999px;padding:10px 16px;cursor:pointer;font-weight:600;color:#0F1B3D}
.date-menu{position:absolute;top:100%;right:0;margin-top:6px;background:#fff;border:1px solid #E5E7EB;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1);display:none;min-width:180px;z-index:20;padding:6px}
.date-menu.open{display:block}
.date-menu button{display:block;width:100%;text-align:left;padding:8px 12px;border:none;background:none;cursor:pointer;font-size:14px;border-radius:8px}
.date-menu button:hover{background:#F7F9FD}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
@media(max-width:1100px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.stat-grid{grid-template-columns:1fr}}
.stat-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(15,27,61,.07);position:relative;overflow:hidden;display:flex;gap:16px;align-items:flex-start;min-height:120px}
.stat-icon{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-icon.green{background:#EAF7EE;color:#16A34A}
.stat-icon.blue{background:#EAF1FB;color:#2563EB}
.stat-icon.orange{background:#FFF3E8;color:#EA580C}
.stat-icon svg{width:32px;height:32px}
.stat-body{flex:1;min-width:0;z-index:1}
.stat-label{font-size:16px;color:#6B7280;margin-bottom:4px}
.stat-value{font-size:32px;font-weight:800;color:#0F1B3D}
.stat-trend{font-size:13px;margin-top:4px}
.stat-chart{position:absolute;right:0;bottom:0;width:40%;height:100%;pointer-events:none;opacity:.5}
.toolbar{background:#fff;border-radius:20px;padding:16px;box-shadow:0 2px 12px rgba(15,27,61,.07);display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar select{height:52px;border-radius:14px;border:1px solid #E5E7EB;padding:0 14px;appearance:none;background:#fff;min-width:140px}
.search-pill{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#F7F9FD;border:1px solid #E5E7EB;border-radius:999px;padding:0 16px;height:52px}
.search-pill input{border:none;background:transparent;flex:1;min-width:0;outline:none}
.filter-btn{height:52px;border-radius:999px;border:1px solid #E5E7EB;background:#fff;padding:0 16px;display:flex;align-items:center;gap:6px;cursor:pointer}
@media(max-width:900px){.search-pill{flex-basis:100%}}
.card{background:#fff;border-radius:20px;padding:0;box-shadow:0 2px 12px rgba(15,27,61,.07);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{font-size:13px;font-weight:700;color:#0F1B3D;text-transform:uppercase;padding:14px 16px;background:#F1F5FB;text-align:left}
td{padding:16px;border-bottom:1px solid #F1F5FB;font-size:14px;color:#0F1B3D}
tr:hover td{background:#F7F9FD}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.debit{background:#FEE2E2;color:#DC2626}
.pill.credit{background:#DCFCE7;color:#16A34A}
.pill.completed{background:#DCFCE7;color:#16A34A}
.pill.pending{background:#FEF3C7;color:#D97706}
.pill.failed{background:#FEE2E2;color:#DC2626}
.amount-debit{font-weight:700;color:#DC2626}
.amount-credit{font-weight:700;color:#16A34A}
.desc-cell{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ref-cell{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:monospace}
.dots-btn{background:none;border:none;cursor:pointer;padding:4px;position:relative}
.menu{position:absolute;background:#fff;border:1px solid #E5E7EB;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.1);display:none;z-index:30;min-width:140px;right:0;top:100%}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:10px 14px;border:none;background:none;cursor:pointer;font-size:14px}
.menu button:hover{background:#F7F9FD}
.footer{display:flex;justify-content:space-between;align-items:center;padding:16px;flex-wrap:wrap;gap:8px}
.pagination{display:flex;gap:6px;align-items:center}
.pagination button{border:1px solid #E5E7EB;background:#fff;padding:6px 10px;border-radius:8px;cursor:pointer}
.pagination button.active{background:#0F1B3D;color:#fff}
.pagination button:disabled{opacity:.5;cursor:not-allowed}
.empty-state{text-align:center;padding:60px 20px}
.empty-state .circle{width:80px;height:80px;border-radius:50%;background:#EAF7EE;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;color:#16A34A}
.skeleton{background:linear-gradient(90deg,#eee,#f5f5f5,#eee);background-size:200% 100%;animation:shimmer 1.2s infinite;height:20px;border-radius:4px;margin:8px 0}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100}
.modal-backdrop.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:520px;width:90%;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:20px;right:20px;background:#0F1B3D;color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:200}
.error-card{background:#FEE2E2;color:#DC2626;padding:16px;border-radius:12px;margin:16px 0;text-align:center}
.error-card button{margin-top:8px;background:#DC2626;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer}
</style>
</head>
<body class="nhs-has-shell">
<div class="page-bg"></div>
<div class="dashboard-layout">
<div id="nhs-sidebar-mount"></div>
<main class="main-content">
<div id="nhs-topbar-mount"></div>
<script src="../../utils/shell.js?v=2"></script>
<div class="dashboard-content" style="position:relative;z-index:1;padding:24px">
  <div class="page-header">
    <div class="tx-icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/></svg></div>
    <div>
      <h1>Transactions</h1>
      <p>View all your wallet transactions</p>
    </div>
    <div class="date-wrap">
      <div class="date-pill" id="datePill">Last 30 days ▾</div>
      <div class="date-menu" id="dateMenu">
        <button data-range="today">Today</button>
        <button data-range="7d">Last 7 days</button>
        <button data-range="30d">Last 30 days</button>
        <button data-range="month">This month</button>
        <button data-range="all">All time</button>
        <button data-range="custom">Custom range</button>
      </div>
    </div>
  </div>

  <div class="stat-grid" id="statGrid">
    <div class="stat-card"><div class="stat-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h7"/><path d="M3 10h18"/></svg></div><div class="stat-body"><div class="stat-label">Total Spent</div><div class="stat-value" id="totalSpent">GH¢0.00</div><div class="stat-trend" id="spentTrend"></div></div><svg class="stat-chart" id="spentChart"></svg></div>
    <div class="stat-card"><div class="stat-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></div><div class="stat-body"><div class="stat-label">Total Received</div><div class="stat-value" id="totalReceived">GH¢0.00</div><div class="stat-trend" id="recvTrend"></div></div><svg class="stat-chart" id="recvChart"></svg></div>
    <div class="stat-card"><div class="stat-icon orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/></svg></div><div class="stat-body"><div class="stat-label">Total Transactions</div><div class="stat-value" id="totalCount">0</div><div class="stat-trend" id="countTrend"></div></div><svg class="stat-chart" id="countChart"></svg></div>
  </div>

  <div class="toolbar">
    <select id="typeFilter"><option value="">All Types</option><option value="debit">Debit</option><option value="credit">Credit</option></select>
    <select id="statusFilter"><option value="">All Status</option><option value="completed">Completed</option><option value="pending">Pending</option><option value="failed">Failed</option></select>
    <div class="search-pill"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="searchInput" placeholder="Search by description..."/></div>
    <button class="filter-btn" id="filterBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>Filter</button>
  </div>

  <div id="errorArea"></div>

  <div class="card">
    <table>
      <thead><tr>
        <th>Date & time</th><th>Type</th><th>Amount</th><th>Description</th><th>Status</th><th>Reference</th><th>Actions</th>
      </tr></thead>
      <tbody id="tbody"><tr><td colspan="7"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></td></tr></tbody>
    </table>
    <div id="emptyState" style="display:none" class="empty-state">
      <div class="circle"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/></svg></div>
      <p style="font-weight:700;font-size:18px;color:#0F1B3D">No transactions found</p>
      <p style="color:#6B7280">Your wallet transactions will appear here.</p>
      <button id="clearFilters" style="margin-top:12px;background:#0F1B3D;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer">Clear filters</button>
    </div>
    <div class="footer">
      <span id="showingText">Showing 0 - 0 of 0 transactions</span>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>
<div class="modal-backdrop" id="modal"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast"></div>
<script src="../../utils/authStorage.js"></script>
<script src="../../utils/api.js"></script>
<script src="../../utils/toast.js"></script>
<script src="../../utils/escape.js"></script>
<script>
const fmt = (n) => 'GH¢' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
let page=1, totalPages=1, range='30d', searchTimer=null, activeMenu=null;
const state={type:'',status:'',search:'',start:'',end:''};
const labels={today:'Today','7d':'Last 7 days','30d':'Last 30 days',month:'This month',all:'All time',custom:'Custom range'};

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000);}
function openModal(html){const m=document.getElementById('modal');document.getElementById('modalContent').innerHTML=html;m.classList.add('open');}
function closeModal(){document.getElementById('modal').classList.remove('open');}

async function load(){
  document.getElementById('errorArea').innerHTML='';
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='<tr><td colspan="7"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></td></tr>';
  const params=new URLSearchParams({page,limit:20,range});
  if(state.type) params.set('type',state.type);
  if(state.status) params.set('status',state.status);
  if(state.search) params.set('search',state.search);
  if(state.start) params.set('start',state.start);
  if(state.end) params.set('end',state.end);
  try{
    const r=await window.apiClient.request('GET','/wallet/transactions?'+params.toString());
    const data=r.data&&r.data.data?r.data.data:r.data;
    const txs=data.transactions||[];
    const pag=data.pagination||{};
    page=pag.page||1; totalPages=pag.totalPages||1;
    tbody.innerHTML='';
    if(txs.length===0){document.getElementById('emptyState').style.display='block';}
    else {document.getElementById('emptyState').style.display='none';
      txs.forEach(tx=>{
        const tr=document.createElement('tr');
        const d=new Date(tx.createdAt).toLocaleString();
        const isCredit=tx.type==='credit';
        tr.innerHTML=`<td>${d}</td><td><span class="pill ${tx.type}">${String(tx.type).toUpperCase()}</span></td><td class="${isCredit?'amount-credit':'amount-debit'}">${isCredit?'+':''}${fmt(tx.amount)}</td><td class="desc-cell" title="${escapeAttr(tx.description||'')}">${escapeHtml(tx.description||'-')}</td><td><span class="pill ${tx.status}">${String(tx.status).toUpperCase()}</span></td><td class="ref-cell" title="${escapeAttr(tx.reference||'')}">${escapeHtml(tx.reference||'-')}</td><td><button class="dots-btn" data-id="${tx.id}" data-tx='${escapeAttr(JSON.stringify(tx))}'>⋯<div class="menu"><button class="viewBtn">View details</button><button class="copyBtn">Copy reference</button></div></button></td>`;
        tbody.appendChild(tr);
      });
    }
    const total=pag.total||0;
    const from=total?((page-1)*20+1):0;
    const to=Math.min(page*20,total);
    document.getElementById('showingText').textContent=`Showing ${from} - ${to} of ${total} transactions`;
    renderPagination();
    await loadStats();
  }catch(e){
    document.getElementById('errorArea').innerHTML='<div class="error-card">Failed to load transactions<button onclick="load()">Retry</button></div>';
  }
}

function renderPagination(){
  const el=document.getElementById('pagination');
  el.innerHTML='';
  if(totalPages<=1) return;
  const prev=document.createElement('button');prev.textContent='‹';prev.disabled=page<=1;prev.onclick=()=>{if(page>1){page--;load();}};el.appendChild(prev);
  for(let i=1;i<=totalPages;i++){
    if(i===1||i===totalPages||Math.abs(i-page)<=1){
      const b=document.createElement('button');b.textContent=i;if(i===page)b.classList.add('active');b.onclick=()=>{page=i;load();};el.appendChild(b);
    } else if(i===2||i===totalPages-1){
      const s=document.createElement('span');s.textContent='…';el.appendChild(s);
    }
  }
  const next=document.createElement('button');next.textContent='›';next.disabled=page>=totalPages;next.onclick=()=>{if(page<totalPages){page++;load();}};el.appendChild(next);
}

async function loadStats(){
  try{
    const params=new URLSearchParams({range});
    if(state.start) params.set('start',state.start);
    if(state.end) params.set('end',state.end);
    const r=await window.apiClient.request('GET','/wallet/transactions/stats?'+params.toString());
    const d=r.data&&r.data.data?r.data.data:r.data;
    document.getElementById('totalSpent').textContent=fmt(d.totalSpent);
    document.getElementById('totalReceived').textContent=fmt(d.totalReceived);
    document.getElementById('totalCount').textContent=d.count;
    drawChart('spentChart',d.series&&d.series.spent,'#16A34A');
    drawChart('recvChart',d.series&&d.series.received,'#2563EB');
    drawChart('countChart',d.series&&d.series.count,'#EA580C');
    // trends
    const prev=d.previous||{};
    setTrend('spentTrend', d.totalSpent, prev.totalSpent);
    setTrend('recvTrend', d.totalReceived, prev.totalReceived);
    setTrend('countTrend', d.count, prev.count);
  }catch(e){}
}

function setTrend(id,cur,prev){
  const el=document.getElementById(id);
  if(!el) return;
  if(range==='all'||!prev||prev<=0||cur<=0){el.textContent='';return;}
  const pct=((cur-prev)/prev*100).toFixed(0);
  const arrow = cur>=prev?'↑':'↓';
  const color = cur>=prev?'#16A34A':'#DC2626';
  el.innerHTML=`<span style="color:${color}">${arrow} ${Math.abs(pct)}% vs prev period</span>`;
}

function drawChart(id,series,color){
  const svg=document.getElementById(id);
  if(!svg) return;
  const pts=(series||[]).map(p=>p.y);
  if(pts.length<2){svg.innerHTML='<line x1="0" y1="30" x2="100%" y2="30" stroke="'+color+'" stroke-width="2" opacity=".3"/>';return;}
  const max=Math.max(...pts,1),min=Math.min(...pts,0),rng=max-min||1;
  const w=100,h=100;
  const line=pts.map((v,i)=>`${i===0?'M':'L'}${(i/(pts.length-1))*w},${h-((v-min)/rng)*h*0.8-5}`).join(' ');
  const area=`M0,${h} L`+pts.map((v,i)=>`${(i/(pts.length-1))*w},${h-((v-min)/rng)*h*0.8-5}`).join(' L')+` L${w},${h} Z`;
  svg.setAttribute('viewBox','0 0 100 100');
  svg.setAttribute('preserveAspectRatio','none');
  svg.innerHTML=`<defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".4"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#g${id})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2"/>`;
}

// date pill
const datePill=document.getElementById('datePill');
const dateMenu=document.getElementById('dateMenu');
datePill.addEventListener('click',e=>{e.stopPropagation();dateMenu.classList.toggle('open');});
document.addEventListener('click',e=>{if(!dateMenu.contains(e.target)&&e.target!==datePill)dateMenu.classList.remove('open');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')dateMenu.classList.remove('open');closeModal();closeMenu();});
dateMenu.querySelectorAll('button').forEach(b=>{
  b.addEventListener('click',()=>{
    const r=b.dataset.range;
    if(r==='custom'){const s=prompt('Start date (YYYY-MM-DD)');const e=prompt('End date (YYYY-MM-DD)');if(s&&e){state.start=s;state.end=e;range='custom';datePill.textContent='Custom range ▾';}}
    else{range=r;state.start='';state.end='';datePill.textContent=labels[r]+' ▾';}
    dateMenu.classList.remove('open');page=1;load();
  });
});

// actions menu
function closeMenu(){if(activeMenu){activeMenu.classList.remove('open');activeMenu=null;}}
document.addEventListener('click',e=>{
  const btn=e.target.closest('.dots-btn');
  if(btn){e.stopPropagation();const m=btn.querySelector('.menu');if(activeMenu&&activeMenu!==m)activeMenu.classList.remove('open');m.classList.toggle('open');activeMenu=m.classList.contains('open')?m:null;return;}
  if(!e.target.closest('.menu'))closeMenu();
});
document.getElementById('tbody').addEventListener('click',e=>{
  const vb=e.target.closest('.viewBtn');const cb=e.target.closest('.copyBtn');
  if(vb){const btn=vb.closest('.dots-btn');const tx=JSON.parse(btn.dataset.tx);openModal(`<h3>Transaction details</h3><p><b>Date:</b> ${new Date(tx.createdAt).toLocaleString()}</p><p><b>Type:</b> ${tx.type}</p><p><b>Amount:</b> ${fmt(tx.amount)}</p><p><b>Status:</b> ${tx.status}</p><p><b>Description:</b> ${escapeHtml(tx.description||'-')}</p><p><b>Reference:</b> ${escapeHtml(tx.reference||'-')} <button onclick="navigator.clipboard.writeText('${escapeAttr(tx.reference||'')}');toast('Copied')">Copy</button></p>${tx.balanceBefore!=null?`<p><b>Balance before:</b> ${fmt(tx.balanceBefore)}</p>`:''}${tx.balanceAfter!=null?`<p><b>Balance after:</b> ${fmt(tx.balanceAfter)}</p>`:''}<button onclick="closeModal()" style="margin-top:12px">Close</button>`);closeMenu();}
  if(cb){const btn=cb.closest('.dots-btn');const tx=JSON.parse(btn.dataset.tx);navigator.clipboard.writeText(tx.reference||'');toast('Copied');closeMenu();}
});

document.getElementById('typeFilter').addEventListener('change',e=>{state.type=e.target.value;page=1;load();});
document.getElementById('statusFilter').addEventListener('change',e=>{state.status=e.target.value;page=1;load();});
document.getElementById('searchInput').addEventListener('input',e=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.search=e.target.value;page=1;load();},300);});
document.getElementById('filterBtn').addEventListener('click',()=>{state.type='';state.status='';state.search='';state.start='';state.end='';range='30d';document.getElementById('typeFilter').value='';document.getElementById('statusFilter').value='';document.getElementById('searchInput').value='';datePill.textContent='Last 30 days ▾';page=1;load();});
document.getElementById('clearFilters').addEventListener('click',()=>document.getElementById('filterBtn').click());
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

document.addEventListener('DOMContentLoaded',async()=>{
  const token=window.getStorage?window.getStorage().getItem('authToken'):localStorage.getItem('authToken');
  if(!token){window.location.href='../auth/login.html';return;}
  try{const r=await window.apiClient.getUserProfile();if(r.data&&r.data.user){const u=r.data.user;const f=u.name?u.name.split(' ')[0]:'User';const un=document.getElementById('userName');if(un)un.textContent=f;}}catch(e){}
  load();
});
</script>
</body>
</html>
